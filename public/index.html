<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CodexRelay · 控制台</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/lucide.js"></script>
</head>
<body>
  <header>
    <div class="brand"><div class="mark"><i data-lucide="waypoints"></i></div><div><h1>CodexRelay</h1><span class="subtitle">Codex 服务控制台</span></div></div>
    <div class="row"><div id="service-status" class="service-status"><span class="status-dot"></span><span id="service-label">正在连接</span></div><button type="button" id="logout" class="icon" title="退出登录" aria-label="退出登录"><i data-lucide="log-out"></i></button></div>
  </header>
  <nav class="quick-nav" aria-label="快捷栏">
    <button type="button" data-view="account-view" aria-current="page"><i data-lucide="gauge"></i>账号额度</button>
    <button type="button" data-view="task-view" aria-current="false"><i data-lucide="messages-square"></i>Codex 调用</button>
    <button type="button" data-view="queue-view" aria-current="false"><i data-lucide="list-ordered"></i>任务队列</button>
    <button type="button" data-view="schedules-view" aria-current="false"><i data-lucide="calendar-clock"></i>定时任务</button>
    <button type="button" data-view="skills-view" aria-current="false"><i data-lucide="folder-tree"></i>项目 Skills</button>
    <button type="button" data-view="logs-view" aria-current="false"><i data-lucide="list-filter"></i>调用日志</button>
    <button type="button" data-view="settings-view" aria-current="false"><i data-lucide="sliders-horizontal"></i>运行配置</button>
  </nav>

  <div id="view-root"></div>
  <div id="view-error" class="message hidden" role="alert"></div>

  <footer><span>CodexRelay / Codex SDK</span><span id="last-updated">尚未同步</span></footer>

  <script type="module" src="/assets/app.js"></script>
</body>
</html>
