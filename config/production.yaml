# Production paths and credentials are supplied by the deployment environment.
dataDir: ${CODEX_DATA_DIR}
invocationLog:
  enabled: true
  directory: ${CODEX_INVOCATION_LOG_DIR}
  retentionDays: 30
server:
  host: ${CODEX_BIND_HOST:-127.0.0.1}
  port: 8787
  tokenEnv: CODEX_MCP_TOKEN
  localConsole: false
  consoleAuth:
    username: ${CODEX_CONSOLE_USERNAME}
    password: ${CODEX_CONSOLE_PASSWORD}
  allowedHosts: [localhost, 127.0.0.1, '[::1]', '${CODEX_PUBLIC_HOST}']
  allowedOrigins: ['${CODEX_PUBLIC_ORIGIN}']
tasks:
  maxConcurrent: 4
  maxQueued: 100
  timeoutSeconds: 600
  queueTimeoutSeconds: 1800
runner: codex
codex:
  sandboxMode: ${CODEX_SANDBOX_MODE:-danger-full-access}
  home: ${CODEX_HOME}
  defaultWorkingDirectory: ${CODEX_WORKSPACE}
  defaultModel: ${CODEX_MODEL:-}
  defaultReasoningEffort: ${CODEX_MODEL_REASONING_EFFORT:-high}
  activeProvider: ${CODEX_PROVIDER:-openai}
  providers:
    - id: openai
      label: OpenAI / Codex
      defaultModel: ${CODEX_MODEL:-gpt-6-sol}
      models: [gpt-6-sol, gpt-6-astra, gpt-6-luna]
    - id: model_studio
      label: 阿里云百炼
      baseUrl: https://dashscope.aliyuncs.com/compatible-mode/v1
      envKey: DASHSCOPE_API_KEY
      defaultModel: qwen3.7-max
      models: [qwen3.7-max, qwen3.7-plus, qwen3.7-flash, glm-5.3]
  envAllowlist: [CODEX_API_KEY, DASHSCOPE_API_KEY, HTTPS_PROXY, HTTP_PROXY, NO_PROXY]
