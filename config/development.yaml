# Local development. Keep this directory to preserve existing sessions and logs.
dataDir: ../data/native-logs-preview
invocationLog:
  enabled: true
  directory: ../data/invocation-logs
  retentionDays: 30
server:
  host: 127.0.0.1
  port: 8787
  tokenEnv: CODEX_MCP_TOKEN
  localConsole: true
  consoleAuth:
    username: admin
    password: admin
  allowedHosts: [localhost, 127.0.0.1, '[::1]']
  allowedOrigins: []
tasks:
  maxConcurrent: 10
  maxQueued: 100
  timeoutSeconds: 600
  queueTimeoutSeconds: 1800
runner: codex
codex:
  sandboxMode: ${CODEX_SANDBOX_MODE:-danger-full-access}
  home: ../data/codex-home
  defaultWorkingDirectory: ../examples/workspace
  defaultModel: ${CODEX_MODEL:-}
  defaultReasoningEffort: ${CODEX_MODEL_REASONING_EFFORT:-high}
  activeProvider: ${CODEX_PROVIDER:-openai}
  providers:
    - id: openai
      label: OpenAI / Codex
      defaultModel: ${CODEX_MODEL:-gpt-6-sol}
      models: [gpt-6-sol, gpt-6-astra, gpt-6-luna]
    - id: model_studio
      label: 阿里云百炼
      baseUrl: https://dashscope.aliyuncs.com/compatible-mode/v1
      envKey: DASHSCOPE_API_KEY
      defaultModel: qwen3.7-max
      models: [qwen3.8-max, qwen3.7-max, qwen3.7-plus, qwen3.7-flash]
